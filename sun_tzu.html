<body>
  <main class="app">

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.src = '/sun_tzu.jpg';

  const fonts = [
    ['Anton', 'Anton'],
    ['Bebas Neue', 'Bebas Neue'],
    ['Oswald', 'Oswald'],
    ['Roboto', 'Roboto']
  ];

  for (const id of ['font1', 'font2']) {
    const select = document.getElementById(id);
    for (const [value, label] of fonts) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    }
    select.value = 'Anton';
  }

  const defaults = {
    flip: false,
    text1: 'The supreme art of war is to make the enemy believe he is fighting a different war.',
    font1: 'Anton', weight1: '700', size1: 58, rotation1: 0, x1: 67, y1: 32,
    width1: 48, line1: 100, color1: '#ffffff', stroke1: '#000000', strokeWidth1: 7, uppercase1: true,
    text2: '— Sun Tzu',
    font2: 'Anton', weight2: '700', size2: 34, rotation2: 0, x2: 80, y2: 65,
    width2: 42, line2: 100, color2: '#ffffff', stroke2: '#000000', strokeWidth2: 6, uppercase2: true
  };

  function el(id) { return document.getElementById(id); }

  function updateValue(id) {
    const input = el(id);
    const out = el(id + 'v');
    if (!out) return;
    const suffix = id.startsWith('x') || id.startsWith('y') || id.startsWith('width') ? '%' :
                   id.startsWith('line') ? '%' :
                   id.startsWith('rotation') ? '°' : 'px';
    out.textContent = input.value + suffix;
  }

  function wrapText(text, maxWidth) {
    const words = text.split(/\s+/);
    const lines = [];
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width <= maxWidth || !line) {
        line = test;
      } else {
        lines.push(line);
        line = word;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawText(n) {
    const text = el('text' + n).value;
    if (!text.trim()) return;

    const font = el('font' + n).value;
    const weight = el('weight' + n).value;
    const size = Number(el('size' + n).value);
    const x = canvas.width * Number(el('x' + n).value) / 100;
    const y = canvas.height * Number(el('y' + n).value) / 100;
    const maxWidth = canvas.width * Number(el('width' + n).value) / 100;
    const lineHeight = size * Number(el('line' + n).value) / 100;
    const rotation = Number(el('rotation' + n).value) * Math.PI / 180;
    const color = el('color' + n).value;
    const stroke = el('stroke' + n).value;
    const strokeWidth = Number(el('strokeWidth' + n).value);
    const uppercase = el('uppercase' + n).checked;

    const content = uppercase ? text.toUpperCase() : text;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    ctx.font = `${weight} ${size}px "${font}"`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const lines = wrapText(content, maxWidth);
    const totalHeight = (lines.length - 1) * lineHeight;
    lines.forEach((line, i) => {
      const yy = i * lineHeight - totalHeight / 2;
      if (strokeWidth > 0) {
        ctx.lineWidth = strokeWidth;
        ctx.strokeStyle = stroke;
        ctx.strokeText(line, 0, yy);
      }
      ctx.fillStyle = color;
      ctx.fillText(line, 0, yy);
    });
    ctx.restore();
  }

  function draw() {
    if (!img.complete || !img.naturalWidth) return;
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    if (el('flip').checked) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(img, 0, 0);
    ctx.restore();

    drawText(1);
    drawText(2);
  }

  function bindAll() {
    document.querySelectorAll('input, select, textarea').forEach(input => {
      input.addEventListener('input', () => {
        updateValue(input.id);
        draw();
      });
      input.addEventListener('change', () => {
        updateValue(input.id);
        draw();
      });
      updateValue(input.id);
    });
  }

  document.getElementById('download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'sun-tzu-meme.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });

  document.getElementById('reset').addEventListener('click', () => {
    for (const [id, value] of Object.entries(defaults)) {
      const input = el(id);
      if (!input) continue;
      if (input.type === 'checkbox') input.checked = value;
      else input.value = value;
      updateValue(id);
    }
    draw();
  });

  img.addEventListener('load', draw);
  img.addEventListener('error', () => {
    const error = el('error');
    error.style.display = 'block';
    error.textContent = 'Could not load /sun_tzu.png. Put the image at the site root.';
  });
  document.fonts.ready.then(draw);
  bindAll();
})();
</script>
